services:
  slingshot:
    image: atcr.io/cove.town/slingshot:latest
    pull_policy: always
    restart: always
    command:
      - "--jetstream"
      - "us-east-1"
      - "--cache-dir"
      - "/data"
      - "--bind"
      - "0.0.0.0:8080"
      - "--collect-metrics"
      - "--bind-metrics"
      - "0.0.0.0:8765"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    environment:
      - RUST_LOG=info
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - slingshot_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network
    labels:
      - observability.enable=true
      - observability.service=slingshot
      - observability.metrics.port=8765
      - observability.metrics.path=/metrics
      - traefik.enable=true
      - traefik.http.routers.slingshot.rule=Host(`slingshot.cove.town`)
      - traefik.http.routers.slingshot.priority=100
      - traefik.http.routers.slingshot.entrypoints=websecure
      - traefik.http.routers.slingshot.tls=true
      - traefik.http.routers.slingshot.service=slingshot
      - traefik.http.routers.slingshot.middlewares=slingshot-ratelimit
      - traefik.http.services.slingshot.loadbalancer.server.port=8080
      - traefik.http.middlewares.slingshot-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.slingshot-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.slingshot-ratelimit.ratelimit.burst=200

volumes:
  slingshot_data:

networks:
  dokploy-network:
    external: true
