services:
  slingshot:
    image: registry.cove.town/cove.town/slingfork:83e152f
    pull_policy: always
    restart: always
    command:
      - "--cache-dir"
      - "/data"
    dns:
      - 185.12.64.1
      - 185.12.64.2
      - 1.1.1.1
    environment:
      - RUST_LOG=${RUST_LOG}
      - SLINGSHOT_JETSTREAM=${SLINGSHOT_JETSTREAM}
      - SLINGSHOT_BIND=0.0.0.0:8080
      - SLINGSHOT_COLLECT_METRICS=true
      - SLINGSHOT_BIND_METRICS=0.0.0.0:8765
      - SLINGSHOT_PLC_DIRECTORY=${SLINGSHOT_PLC_DIRECTORY}
      - SLINGSHOT_RECORD_CACHE_MEMORY_MB=${SLINGSHOT_RECORD_CACHE_MEMORY_MB}
      - SLINGSHOT_RECORD_CACHE_DISK_GB=${SLINGSHOT_RECORD_CACHE_DISK_GB}
      - SLINGSHOT_IDENTITY_CACHE_MEMORY_MB=${SLINGSHOT_IDENTITY_CACHE_MEMORY_MB}
      - SLINGSHOT_IDENTITY_CACHE_DISK_GB=${SLINGSHOT_IDENTITY_CACHE_DISK_GB}
      - SLINGSHOT_HEALTHCHECK=${SLINGSHOT_HEALTHCHECK}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - slingshot_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dokploy-network
    labels:
      - observability.enable=true
      - observability.service=slingshot
      - observability.metrics.port=8765
      - observability.metrics.path=/metrics
      - traefik.enable=true
      # enable rate limiting
      - traefik.http.routers.slingshot.rule=Host(`slingshot.cove.town`)
      - traefik.http.routers.slingshot.priority=100
      - traefik.http.routers.slingshot.entrypoints=websecure
      - traefik.http.routers.slingshot.tls=true
      - traefik.http.routers.slingshot.service=slingshot
      - traefik.http.routers.slingshot.middlewares=slingshot-ratelimit
      - traefik.http.services.slingshot.loadbalancer.server.port=8080
      # public IPs get a sensible default
      - traefik.http.middlewares.slingshot-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.slingshot-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.slingshot-ratelimit.ratelimit.burst=200
      # private IPs are not limited
      - traefik.http.routers.slingshot-internal.rule=Host(`slingshot.cove.town`) && ClientIP(`10.0.0.0/8`)
      - traefik.http.routers.slingshot-internal.priority=200
      - traefik.http.routers.slingshot-internal.entrypoints=websecure
      - traefik.http.routers.slingshot-internal.tls=true
      - traefik.http.routers.slingshot-internal.service=slingshot

volumes:
  slingshot_data:

networks:
  dokploy-network:
    external: true
