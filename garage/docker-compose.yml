services:
  garage:
    image: dxflrs/garage:v2.3.0
    restart: always
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      dokploy-network:
        aliases:
          - spindle-logs.garage
    labels:
      - observability.enable=true
      - observability.service=garage
      - observability.metrics.port=3903
      - observability.metrics.path=/metrics

volumes:
  garage_meta:
  garage_data:

networks:
  dokploy-network:
    external: true
