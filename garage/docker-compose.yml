services:
  garage:
    image: dxflrs/garage:v2.4.1
    restart: always
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      dokploy-network:
        aliases:
          - spindle-logs.garage
    labels:
      - observability.enable=true
      - observability.service=garage
      - observability.metrics.port=3903
      - observability.metrics.path=/metrics

  webadmin:
    build: ./webadmin
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
    ports:
      - "3910:8080"
    labels:
      - tsdproxy.enable=true
      - tsdproxy.name=garage
      - tsdproxy.port.1=443/https:8080/http
    networks:
      - dokploy-network

volumes:
  garage_meta:
  garage_data:

networks:
  dokploy-network:
    external: true
