when:
  - event: ["push"]
    branch: ["main"]
    paths:
      - "castaway/**"

engine: nixery

dependencies:
  nixpkgs:
    - kaniko

steps:
  - name: build and push
    command: |
      set -euo pipefail
      export DOCKER_CONFIG=/tmp/docker-config
      mkdir -p "$DOCKER_CONFIG"
      printf '{"auths":{"atcr.io":{"auth":"%s"}}}' "$(echo -n "ferry.cove.town:$CI_BOT_PASSWORD" | base64 -w0)" > "$DOCKER_CONFIG/config.json"
      executor --context ./castaway --dockerfile ./castaway/Dockerfile \
        --destination "atcr.io/ferry.cove.town/castaway:$TANGLED_SHA" \
        --destination "atcr.io/ferry.cove.town/castaway:latest"

  - name: trigger redeploy
    command: |
      curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
