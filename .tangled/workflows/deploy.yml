when:
  - event: ["push"]
    branch: ["main"]
    paths:
      - "castaway/**"

engine: microvm
image: nixos

dependencies:
  - kaniko

steps:
  - name: build and push
    command: |
      export DOCKER_CONFIG="$HOME/.docker"
      mkdir -p "$DOCKER_CONFIG"
      printf '{"auths":{"atcr.io":{"auth":"%s"}}}' \
        "$(echo -n "ci.cove.town:$CI_BOT_PASSWORD" | base64 -w0)" \
        > "$DOCKER_CONFIG/config.json"
      TAG=$(git rev-parse --short HEAD)
      kaniko --context ./castaway --dockerfile ./castaway/Dockerfile \
        --destination "atcr.io/ci.cove.town/castaway:$TAG" \
        --destination "atcr.io/ci.cove.town/castaway:latest"
