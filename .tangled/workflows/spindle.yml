when:
  - event: ["push"]
    branch: ["main"]
    paths:
      - ".tangled/workflows/spindle.yml"

engine: nixery

environment:
  VERSION: v1.16.1-alpha

dependencies:
  nixpkgs:
    - docker-client
    - curl

steps:
  - name: build and push
    command: |
      set -euo pipefail
      echo "$CI_BOT_PASSWORD" | docker login atcr.io -u cove.town --password-stdin
      git clone https://tangled.org/tangled.org/core.git /tmp/src
      git -C /tmp/src checkout "$VERSION"
      docker build \
        -f /tmp/src/localinfra/spindle.Dockerfile \
        -t "atcr.io/cove.town/spindle:$VERSION" \
        -t "atcr.io/cove.town/spindle:latest" \
        /tmp/src
      docker push "atcr.io/cove.town/spindle:$VERSION"
      docker push "atcr.io/cove.town/spindle:latest"

  - name: trigger redeploy
    command: |
      curl -fsS -X POST "$DOKPLOY_WEBHOOK_SPINDLE"
