when:
  - event: ["push"]
    branch: ["main"]
    paths:
      - ".tangled/workflows/pds.yml"

engine: nixery

dependencies:
  nixpkgs:
    - kaniko
    - curl

steps:
  - name: build and push
    command: |
      set -euo pipefail
      export DOCKER_CONFIG=/tmp/docker-config
      mkdir -p "$DOCKER_CONFIG"
      printf '{"auths":{"atcr.io":{"auth":"%s"}}}' "$(echo -n "ferry.cove.town:$CI_BOT_PASSWORD" | base64 -w0)" > "$DOCKER_CONFIG/config.json"
      executor --context "git://https://tangled.org/tranquil.farm/tranquil-pds.git#refs/heads/main#bc751b0ee2fef8dfebb5c36775b5aa672e5d086d" \
        --build-arg "DISTROLESS_IMAGE=gcr.io/distroless/cc-debian13:latest@sha256:a017e74bd2a12d98342dbecd33d121d2b160415ed777573dc1808969e989d94d" \
        --cache=true --cache-repo atcr.io/ferry.cove.town/cache/tranquil-pds \
        --destination "atcr.io/ferry.cove.town/tranquil-pds:$TANGLED_SHA" \
        --destination "atcr.io/ferry.cove.town/tranquil-pds:latest"

  - name: trigger redeploy
    command: |
      curl -fsS -X POST "$DOKPLOY_WEBHOOK_PDS"
