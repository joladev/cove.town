when:
  - event: ["push"]
    branch: ["main"]
    paths:
      - ".tangled/workflows/slingshot.yml"

engine: nixery

environment:
  VERSION: 3137b07
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.28.3@sha256:779f463aaa3219151ceff518249aa043a60bcb09a17fab58b915f63c678ecde6

dependencies:
  nixpkgs:
    - go-containerregistry
    - gnutar
    - gnused
    - gnugrep
  github:nixos/nixpkgs:
    - bash
    - curl
    - cacert

steps:
  - name: build and push
    command: |
      set -euo pipefail
      crane export --platform linux/arm64 "$KANIKO_IMAGE" - | tar -xf - -C /tmp kaniko/executor
      export DOCKER_CONFIG=/tmp/docker-config
      mkdir -p "$DOCKER_CONFIG"
      echo "$CI_BOT_PASSWORD" | /tmp/kaniko/executor login atcr.io -u cove.town --password-stdin
      git clone https://tangled.org/microcosm.blue/microcosm-rs.git /tmp/src
      git -C /tmp/src checkout "$VERSION"
      /tmp/kaniko/executor \
        --context /tmp/src \
        --dockerfile /tmp/src/slingshot/Dockerfile \
        --ignore-path /tmp/src \
        --ignore-path /tmp/docker-config \
        --ignore-path /tangled \
        --ignore-path /nix \
        --destination "atcr.io/cove.town/slingshot:$VERSION" \
        --destination "atcr.io/cove.town/slingshot:latest"

  - name: trigger redeploy
    environment:
      SSL_CERT_FILE: /tangled/home/.nix-profile/etc/ssl/certs/ca-bundle.crt
    command: |
      curl -fsS -X POST "$DOKPLOY_WEBHOOK_SLINGSHOT"
