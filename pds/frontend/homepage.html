    main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem; }
    .content { width:100%; max-width:760px; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:3rem; align-items:baseline; }

    a { color:#2b8a7d; font-weight:700; text-decoration:none; border-bottom:2px solid #ffd9a8; }
    a:hover { color:#e2705c; border-bottom-color:#e2705c; }
    .muted { color:#467479; }
    .actions { display:flex; flex-wrap:wrap; gap:.6rem; margin:1.8rem 0 2.2rem; }
    .button { padding:.5rem 1.2rem; border:2px solid #ffd9a8; border-radius:999px; color:#2f5d63; }
    .button:hover { border-color:#e2705c; }
    .button.primary { background:#2f5d63; border-color:#2f5d63; color:#fdf6e9; }
    .button.primary:hover { background:#e2705c; border-color:#e2705c; color:#fdf6e9; }
    .post p { margin-bottom:0; }
    .post-text { line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .harbor { display:block; flex-shrink:0; width:100%; height:clamp(170px, 25vh, 300px); }
    .boat { animation:bob 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 80%; }
    .boat.late { animation-delay:-2.3s; }
    .beam { animation:beam 7s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(-4px) rotate(1deg); } }
    @keyframes beam { 0%,100% { opacity:.2; } 50% { opacity:.55; } }
    @media (prefers-reduced-motion: reduce) { .boat, .beam { animation:none; } }
    @media (max-width: 640px) { .content { grid-template-columns:minmax(0, 1fr); } .updates { display:none; } }
  </style>

    <section>
      <h1>pds.cove.town</h1>
      <p>The PDS of <a href="https://cove.town">cove.town</a>, hosting and serving atproto accounts and data. Used as a backend for several projects, including <a href="https://shelf.cafe">shelf.cafe</a></p>
      <p>Want an invite? Send us an email at <a href="mailto:hello@cove.town">hello@cove.town</a></p>
      <div class="actions">
        <a class="button primary" id="join" href="/app/register">Join</a>
        <a class="button" id="login" href="/app/login">Login</a>
        <a class="button" id="run-your-own" href="https://tangled.org/tranquil.farm/tranquil-pds" target="_blank" rel="noopener">Run your own</a>
      </div>
    </section>
    <section class="updates">
      <h2>Updates</h2>
      <div id="posts"></div>
      <template id="post">
        <article class="post">
          <p><strong class="handle"></strong><span class="muted">, <time></time></span></p>
          <p class="post-text"></p>
        </article>
      </template>
    </section>
  </div>
</main>

<script type="module">
  async function xrpc(method, params) {
    const response = await fetch(`/xrpc/${method}?${new URLSearchParams(params)}`);
    const body = await response.json();
    if (!response.ok) throw new Error(`${method} returned ${response.status} ${body.error}${body.message ? `: ${body.message}` : ""}`);
    return body;
  }

  function showError(element, prefix, error) {
    console.error(error);
    element.textContent = `${prefix}: ${error.message}`;
  }

  function renderSession() {
    const stored = localStorage.getItem("tranquil_pds_session");
    if (stored === null) return;
    const { handle } = JSON.parse(stored);
    const join = document.getElementById("join");
    join.href = "/app/dashboard";
    join.textContent = `@${handle}`;
    document.getElementById("login").hidden = true;
    document.getElementById("run-your-own").hidden = true;
  }

  const FEATURED_DID = "did:plc:t7lco4vymbvvhb5hoyfn4w3b";

  async function renderPosts() {
    const { records } = await xrpc("com.atproto.repo.listRecords", { repo: FEATURED_DID, collection: "app.bsky.feed.post", limit: 100 });
    const posts = records
      .filter(({ value }) => !value.reply && value.text.trim() !== "")
      .sort((a, b) => Date.parse(b.value.createdAt) - Date.parse(a.value.createdAt))
      .slice(0, 1)
      .map((record) => ({ did: FEATURED_DID, record }));
    document.getElementById("posts").replaceChildren(...(await Promise.all(posts.map(renderPost))));
  }

  async function renderPost({ did, record }) {
    const { handle } = await xrpc("com.atproto.repo.describeRepo", { repo: did });
    const post = document.getElementById("post").content.cloneNode(true);
    const time = post.querySelector("time");
    post.querySelector(".handle").textContent = handle;
    time.dateTime = record.value.createdAt;
    time.textContent = new Date(record.value.createdAt).toLocaleDateString("en", { month: "short", day: "numeric", year: "numeric" });
    post.querySelector(".post-text").textContent = record.value.text;
    return post;
  }

  renderPosts().catch((error) => showError(document.getElementById("posts"), "Couldn't load posts", error));
  renderSession();
</script>
