services:
  pds:
    image: atcr.io/cove.town/tranquil-pds:latest
    pull_policy: always
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/tranquil-pds", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - SERVER_HOST=${SERVER_HOST}
      - PDS_HOSTNAME=${PDS_HOSTNAME}
      - PDS_USER_HANDLE_DOMAINS=${PDS_USER_HANDLE_DOMAINS}
      - PDS_BANNED_WORDS=${PDS_BANNED_WORDS}
      - INVITE_CODE_REQUIRED=${INVITE_CODE_REQUIRED}
      - DISABLE_ACCOUNT_VERIFICATION_GATE=${DISABLE_ACCOUNT_VERIFICATION_GATE}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      - CRAWLERS=${CRAWLERS}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DPOP_SECRET=${DPOP_SECRET}
      - MASTER_KEY=${MASTER_KEY}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_SMARTHOST_HOST=${MAIL_SMARTHOST_HOST}
      - MAIL_SMARTHOST_PORT=${MAIL_SMARTHOST_PORT}
      - MAIL_SMARTHOST_TLS=${MAIL_SMARTHOST_TLS}
      - MAIL_SMARTHOST_USERNAME=${MAIL_SMARTHOST_USERNAME}
      - MAIL_SMARTHOST_PASSWORD=${MAIL_SMARTHOST_PASSWORD}
      - MAIL_REQUIRE_TLS=true
      - PLC_ROTATION_KEY=${PLC_ROTATION_KEY}
      - BLOB_STORAGE_BACKEND=s3
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.pds-handles.rule=HostRegexp(`^.+\.cove\.town$`)
      - traefik.http.routers.pds-handles.entrypoints=websecure
      - traefik.http.routers.pds-handles.priority=1
      - traefik.http.routers.pds-handles.tls=true
      - traefik.http.routers.pds-handles.service=pds-handles
      - traefik.http.services.pds-handles.loadbalancer.server.port=3000
      - observability.enable=true
      - observability.service=pds

networks:
  dokploy-network:
    external: true
